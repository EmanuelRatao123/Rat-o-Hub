services:
  - type: web
    name: rataohub-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rataohub-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  - type: web
    name: rataohub-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rataohub-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: rataohub-db
    databaseName: rataohub
    user: rataohub_user
